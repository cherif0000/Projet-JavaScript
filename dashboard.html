<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <title>Mes CVs - CV Builder Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Navigation principale">
    <div class="navbar__inner">
      <a href="dashboard.html" class="navbar__brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
        CV Builder Pro
      </a>
      <div class="navbar__nav">
        <button class="navbar__link navbar__link--logout" id="btn-logout">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          Deconnexion
        </button>
      </div>
    </div>
  </nav>

  <!-- CONTENU PRINCIPAL -->
  <main class="dashboard container">
    <div class="dashboard__header">
      <div>
        <h1 class="dashboard__title">Mes CVs</h1>
        <p class="dashboard__subtitle">Gerez et creez vos curriculums vitae.</p>
      </div>
      <button class="btn btn--primary btn--lg" id="btn-new-cv">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
        Nouveau CV
      </button>
    </div>

    <!-- Grille des CVs -->
    <div id="cv-grid" class="cv-grid"></div>

    <!-- Etat vide -->
    <div id="empty-state" class="empty-state hidden">
      <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
      <h2 class="empty-state__title">Aucun CV pour le moment</h2>
      <p class="empty-state__text">Commencez par creer votre premier CV professionnel.</p>
      <button class="btn btn--primary btn--lg" id="btn-new-cv-empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
        Creer mon premier CV
      </button>
    </div>
  </main>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Config -->
  <script src="config/firebase-config.js"></script>
  <script src="config/Toast.js"></script>
  <!-- Model -->
  <script src="Model/AuthModel.js"></script>
  <script src="Model/CVModel.js"></script>
  <!-- View -->
  <script src="View/AuthView.js"></script>
  <script src="View/DashboardView.js"></script>
  <!-- Controller -->
  <script src="Controller/AuthController.js"></script>
  <script src="Controller/DashboardController.js"></script>

  <script>
    $(function () {
      DashboardController.init();

      // Binding bouton empty state aussi
      $("#btn-new-cv-empty").on("click", function () {
        DashboardController.createNewCV();
      });
    });
  </script>
</body>
</html>
