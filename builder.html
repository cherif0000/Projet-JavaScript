<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <title>Editeur de CV - CV Builder Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar no-print" role="navigation" aria-label="Navigation principale">
    <div class="navbar__inner">
      <a href="dashboard.html" class="navbar__brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
        CV Builder Pro
      </a>
      <div class="navbar__nav">
        <button class="navbar__link" id="btn-back">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Retour
        </button>
        <button class="navbar__link navbar__link--logout" id="btn-builder-logout">Deconnexion</button>
      </div>
    </div>
  </nav>

  <!-- BUILDER -->
  <div class="builder">

    <!-- FORMULAIRE (gauche) -->
    <div class="builder__form no-print">
      <h2 class="builder__form-title">Editeur de CV</h2>

      <form id="builder-form" onsubmit="return false;">

        <!-- Informations personnelles -->
        <div class="form-section">
          <div class="form-section__header">
            <h3 class="form-section__title">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Informations personnelles
            </h3>
          </div>
          <!-- Photo Upload -->
          <div class="form-group">
            <label>Photo de profil</label>
            <div class="photo-upload" id="photo-upload-zone">
              <input type="file" id="input-photo" accept="image/*" class="photo-upload__input" aria-label="Importer une photo de profil">
              <div class="photo-upload__preview" id="photo-preview">
                <span class="photo-upload__placeholder">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </span>
              </div>
              <div class="photo-upload__info">
                <span class="photo-upload__text">Cliquez ou deposez votre photo ici</span>
                <span class="photo-upload__hint">JPG, PNG</span>
              </div>
              <button type="button" class="btn btn--sm btn--danger photo-upload__remove hidden" id="btn-remove-photo" aria-label="Supprimer la photo">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
                Supprimer
              </button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="input-fullname">Nom complet</label>
              <input type="text" id="input-fullname" class="form-input" placeholder="Cherif Khalla">
            </div>
            <div class="form-group">
              <label for="input-jobtitle">Poste vise</label>
              <input type="text" id="input-jobtitle" class="form-input" placeholder="Data Scientist">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="input-email">Email</label>
              <input type="email" id="input-email" class="form-input" placeholder="cherif@example.com">
            </div>
            <div class="form-group">
              <label for="input-phone">Telephone</label>
              <input type="tel" id="input-phone" class="form-input" placeholder="+221  00 000 00 00">
            </div>
          </div>
          <div class="form-group">
            <label for="input-address">Adresse</label>
            <input type="text" id="input-address" class="form-input" placeholder="Dakar, Senegal">
          </div>
          <div class="form-group">
            <label for="input-about">A propos / Profil</label>
            <textarea id="input-about" class="form-input" placeholder="Decrivez-vous brievement..."></textarea>
          </div>
        </div>

        <!-- Experiences professionnelles -->
        <div class="form-section">
          <div class="form-section__header">
            <h3 class="form-section__title">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              Experiences professionnelles
            </h3>
            <button type="button" class="btn btn--secondary btn--sm" id="btn-add-experience">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
              Ajouter
            </button>
          </div>
          <div id="experiences-container"></div>
        </div>

        <!-- Formation -->
        <div class="form-section">
          <div class="form-section__header">
            <h3 class="form-section__title">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 6 3 6 3s3 0 6-3v-5"/></svg>
              Formation
            </h3>
            <button type="button" class="btn btn--secondary btn--sm" id="btn-add-education">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
              Ajouter
            </button>
          </div>
          <div id="education-container"></div>
        </div>

        <!-- Competences -->
        <div class="form-section">
          <div class="form-section__header">
            <h3 class="form-section__title">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Competences
            </h3>
          </div>
          <div class="form-group">
            <label for="input-skills">Competences</label>
            <input type="text" id="input-skills" class="form-input" placeholder="HTML, CSS, JavaScript, Python, Git...">
          </div>
        </div>

        <!-- Langues -->
        <div class="form-section">
          <div class="form-section__header">
            <h3 class="form-section__title">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              Langues
            </h3>
            <button type="button" class="btn btn--secondary btn--sm" id="btn-add-language">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
              Ajouter
            </button>
          </div>
          <div id="languages-container"></div>
        </div>

      </form>

      <!-- Actions -->
      <div class="builder__actions">
        <button class="btn btn--primary btn--lg" id="save-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
          Sauvegarder
        </button>
        <button class="btn btn--secondary btn--lg" id="export-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Exporter PDF
        </button>
      </div>
    </div>

    <!-- PREVIEW (droite) -->
    <div class="builder__preview">
      <div class="cv-preview" id="cv-preview-content"></div>
    </div>

  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Config -->
  <script src="config/firebase-config.js"></script>
  <script src="config/Toast.js"></script>
  <!-- Model -->
  <script src="Model/AuthModel.js"></script>
  <script src="Model/CVModel.js"></script>
  <!-- View -->
  <script src="View/AuthView.js"></script>
  <script src="View/BuilderView.js"></script>
  <!-- Controller -->
  <script src="Controller/AuthController.js"></script>
  <script src="Controller/BuilderController.js"></script>

  <script>
    $(function () {
      BuilderController.init();
    });
  </script>
</body>
</html>
